services:
  - type: web
    name: istms
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn istms_project.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: istms-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: MEDIA_ROOT
        value: /tmp/istms-media

databases:
  - name: istms-db
    databaseName: istms
    user: istms
    plan: free
    region: singapore
